<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
        />
        <meta name="theme-color" content="#14584a" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta
            name="apple-mobile-web-app-status-bar-style"
            content="black-translucent"
        />
        <title>SEMRA · Admin</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="/shared/styles.css" />
    </head>
    <body>
        <div class="phone">
            <div class="island"></div>
            <div class="statusbar">
                <span id="clock">9:41</span
                ><span class="ic"
                    ><svg viewBox="0 0 18 18">
                        <rect x="1" y="5" width="3" height="8" rx="1" />
                        <rect x="6" y="3" width="3" height="10" rx="1" />
                        <rect x="11" y="1" width="3" height="12" rx="1" /></svg
                    ><svg viewBox="0 0 20 14">
                        <path
                            d="M10 3a8 8 0 0 1 5.7 2.4M10 3a8 8 0 0 0-5.7 2.4M10 7a4 4 0 0 1 3 .9M10 7a4 4 0 0 0-3 .9"
                        /></svg
                    ><svg viewBox="0 0 26 13">
                        <rect
                            x="1"
                            y="1"
                            width="22"
                            height="11"
                            rx="3"
                            fill="none"
                            stroke="#fff"
                            stroke-width="1.2"
                        />
                        <rect x="3" y="3" width="18" height="7" rx="1.5" />
                        <rect x="24" y="4" width="1.5" height="5" rx="1" /></svg
                ></span>
            </div>
            <div class="app" id="app"></div>
            <div class="sheet" id="sheet">
                <div class="sheet-bg" id="sheetBg"></div>
                <div class="sheet-card">
                    <div class="sheet-grip"></div>
                    <h3 id="shName">Fajr</h3>
                    <div class="sub" id="shSub">Dawn prayer · edit time</div>
                    <div class="timepick">
                        <div class="numselect">
                            <label>Hour</label>
                            <div class="val" id="shH">5</div>
                            <div>
                                <button data-d="-1">−</button
                                ><button data-d="1">+</button>
                            </div>
                        </div>
                        <div class="numselect">
                            <label>Min</label>
                            <div class="val" id="shM">14</div>
                            <div>
                                <button data-d="-1">−</button
                                ><button data-d="1">+</button>
                            </div>
                        </div>
                    </div>
                    <div class="ampm" id="shAmpm">
                        <button data-ap="AM">AM</button
                        ><button data-ap="PM" class="sel">PM</button>
                    </div>
                    <div class="sheet-actions">
                        <button class="btn ghost" id="shCancel">Cancel</button
                        ><button class="btn primary" id="shSave">Save</button>
                    </div>
                </div>
            </div>
            <nav class="nav" style="grid-template-columns: repeat(4, 1fr)">
                <button class="on" data-go="schedule">
                    <svg viewBox="0 0 24 24">
                        <rect x="3" y="4" width="18" height="17" rx="2" />
                        <path d="M3 9h18M8 2v4M16 2v4" /></svg
                    >Schedule
                </button>
                <button data-go="events">
                    <svg viewBox="0 0 24 24">
                        <path d="M8 2v4M16 2v4" />
                        <rect x="3" y="4" width="18" height="18" rx="2" />
                        <path d="M3 10h18" /></svg
                    >Events
                </button>
                <button data-go="academy">
                    <svg viewBox="0 0 24 24">
                        <path d="M4 19V5l8-2 8 2v14" />
                        <path d="M4 9h16" />
                        <path d="M12 3v16" /></svg
                    >Academy
                </button>
                <button data-go="compose">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"
                        /></svg
                    >Compose
                </button>
            </nav>
            <div class="home-bar"></div>
        </div>
        <script type="module" src="admin.js"></script>
    </body>
</html>
